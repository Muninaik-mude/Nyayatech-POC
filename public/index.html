<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courts POC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f6;--border:#e1e4ea;--fg:#111827;--fg2:#4b5563;--fg3:#8a93a3;--accent:#1d4ed8;--accent-bg:#eff6ff;--accent-hover:#1e40af;--ok:#047857;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fffbeb;--err:#b91c1c;--err-bg:#fef2f2;--tier-http:#0369a1;--tier-lp:#7c3aed;--tier-cr:#374151;--radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.04);--ff:'Inter',system-ui,sans-serif;--ff-mono:'JetBrains Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--surface:#1a1d27;--surface2:#242736;--border:#2e3347;--fg:#e8eaf2;--fg2:#9aa0b8;--fg3:#6b7294;--accent:#60a5fa;--accent-bg:#1e2d4a;--accent-hover:#93c5fd;--ok:#34d399;--ok-bg:#052e16;--warn:#fbbf24;--warn-bg:#2d1a00;--err:#f87171;--err-bg:#2d0707;--tier-http:#38bdf8;--tier-lp:#c084fc;--tier-cr:#9ca3af;--shadow:0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);font-size:14px;color:var(--fg);background:var(--bg);min-height:100vh;line-height:1.5}
.container{max-width:1280px;margin:0 auto;padding:0 16px 48px}
.header{display:flex;align-items:center;gap:10px;padding:20px 0}
.header h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
.header .sub{margin-left:auto;font-size:12px;color:var(--fg3)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.search-card{padding:20px}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:16px}
.seg button{padding:6px 16px;border:none;background:transparent;border-radius:6px;font:500 13px var(--ff);color:var(--fg2);cursor:pointer}
.seg button.active{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--fg2);margin-bottom:5px}
.field select,.field input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--fg);font:14px var(--ff);outline:none;transition:border-color .15s,box-shadow .15s}
.field select:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.mono{font-family:var(--ff-mono)!important;letter-spacing:.03em}
.combo{position:relative}
.combo-list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:240px;overflow:auto;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow)}
.combo-list[hidden]{display:none}
.combo-list li{padding:9px 12px;font:13px var(--ff-mono);cursor:pointer}
.combo-list li:hover{background:var(--surface2)}
.hint{font-size:12px;color:var(--ok);margin:-4px 0 12px}
.actions{display:flex;align-items:center;gap:16px;margin-top:4px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 28px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font:600 14px var(--ff);cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:var(--accent-hover)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}
.adv{margin-left:auto;font-size:13px;color:var(--fg2)}
.adv summary{cursor:pointer;user-select:none}
.adv-body{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.adv-body select{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg);font:13px var(--ff)}
.adv-body label.cb{display:flex;align-items:center;gap:6px;cursor:pointer}
.btn-spinner{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.search-col{position:sticky;top:16px}
.layout .grid{grid-template-columns:1fr 1fr}
.layout .grid>.full,.layout #hcFields{grid-column:1/-1}
.layout #form-case.grid .field:first-child,.layout #districtFields .field:last-child{grid-column:1/-1}
@media(max-width:860px){.layout{grid-template-columns:1fr}.search-col{position:static}}
#resultsWrap{display:flex;flex-direction:column;gap:16px;min-width:0}
.empty-state{padding:36px 24px;text-align:center;color:var(--fg3);font-size:13.5px}
.empty-state .illo{font-size:32px;margin-bottom:6px}
.loading-overlay{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 24px;color:var(--fg2)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.case-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.case-title{flex:1;min-width:0}
.case-title h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.case-title .meta{font-size:12.5px;color:var(--fg2);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.case-title code{font-family:var(--ff-mono);font-size:12px}
.status-pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status-pill.ok{background:var(--ok-bg);color:var(--ok)}.status-pill.pending{background:var(--warn-bg);color:var(--warn)}.status-pill.other{background:var(--surface2);color:var(--fg2)}
.tier-badge{font-family:var(--ff-mono);font-size:11px;padding:2px 8px;border-radius:999px}
.tier-badge.http{background:color-mix(in srgb,var(--tier-http) 12%,transparent);color:var(--tier-http)}
.tier-badge.lightpanda{background:color-mix(in srgb,var(--tier-lp) 12%,transparent);color:var(--tier-lp)}
.tier-badge.chromium{background:color-mix(in srgb,var(--tier-cr) 12%,transparent);color:var(--tier-cr)}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto}
.tab-btn{padding:11px 14px;border:none;background:transparent;color:var(--fg2);font:500 13px var(--ff);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-pane{display:none}.tab-pane.active{display:block}
.field-table{width:100%;border-collapse:collapse;font-size:13.5px}
.field-table td{padding:10px 20px;border-bottom:1px solid var(--border);vertical-align:top}
.field-table td:first-child{width:34%;color:var(--fg2);font-size:12.5px}
.field-table tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:9px 14px;font-size:12px;font-weight:600;color:var(--fg2);background:var(--surface2);border-bottom:1px solid var(--border)}
.data-table td{padding:9px 14px;border-bottom:1px solid var(--border)}
.data-table tr:last-child td{border-bottom:none}
.doc-list,.party-list{list-style:none}
.doc-item,.party-item{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border)}
.doc-item:last-child,.party-item:last-child{border-bottom:none}
.doc-info{flex:1;min-width:0}.doc-name{font-weight:500}.doc-date{font-size:12px;color:var(--fg2)}
.doc-link{font-size:12px;padding:4px 10px;border-radius:6px;background:var(--accent-bg);color:var(--accent);font-weight:600;text-decoration:none}
.party-role{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;min-width:90px;color:var(--fg3)}
.party-adv{font-size:12px;color:var(--fg2);margin-left:auto}
.raw-actions{padding:10px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--fg2)}
.btn-sm{font-size:12px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg);cursor:pointer}
.raw-scroll{max-height:320px;overflow:auto;padding:12px 20px}
.raw-scroll pre{font-family:var(--ff-mono);font-size:11.5px;white-space:pre-wrap;word-break:break-all;color:var(--fg2)}
.panel-head{padding:12px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.panel-head .dot{width:8px;height:8px;border-radius:50%}
.metrics-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.metric-cell{padding:12px 20px;border-right:1px solid var(--border)}
.metric-cell:last-child{border-right:none}
.metric-cell .label{font-size:11.5px;color:var(--fg3);margin-bottom:2px}
.metric-cell .value{font-family:var(--ff-mono);font-size:17px;font-weight:500}
.metric-cell .unit{font-size:11px;color:var(--fg3);margin-left:2px}
.escalations{padding:10px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--fg2);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.esc{padding:2px 8px;background:var(--warn-bg);color:var(--warn);border-radius:999px;font-size:11.5px}
.error-banner{background:var(--err-bg);border:1px solid color-mix(in srgb,var(--err) 30%,transparent);border-radius:var(--radius);padding:14px 18px;display:flex;gap:10px}
.error-banner .msg{color:var(--err);font-size:13px}
.empty-list{padding:24px 20px;color:var(--fg3);text-align:center}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.compare-label{font-size:12px;font-weight:600;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface2)}
@media(max-width:560px){.case-header{flex-direction:column}.adv{margin-left:0}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <svg width="24" height="24" viewBox="0 0 22 22" fill="none"><rect width="22" height="22" rx="5" fill="var(--accent)"/><path d="M4 16h14M7 10h8M11 6v4M7 10v6M15 10v6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
    <h1>Courts POC</h1>
    <div class="sub">Indian court case search</div>
  </div>

<div class="layout">
<div class="search-col">
  <div class="card search-card">
    <div class="seg" id="searchBy">
      <button class="active" data-by="cnr" onclick="setSearchBy('cnr',this)">CNR</button>
      <button data-by="case" onclick="setSearchBy('case',this)">Case No</button>
      <button data-by="filing" onclick="setSearchBy('filing',this)">Filing No</button>
    </div>

    <div class="grid">
      <div class="field full">
        <label for="courtLevel">Court level</label>
        <select id="courtLevel" onchange="onCourtChange()">
          <option value="district">District Court</option>
          <option value="high_court">High Court</option>
        </select>
      </div>
      <div class="field" id="hcFields" style="display:none">
        <label for="benchSelect">High Court</label>
        <select id="benchSelect" onchange="loadCnrList()">
          <option value="KRHC">Karnataka</option>
          <option value="APHC">Andhra Pradesh</option>
          <option value="TSHC">Telangana</option>
          <option value="KLHC">Kerala</option>
          <option value="DLHC">Delhi</option>
          <option value="TNHC">Madras (Tamil Nadu)</option>
          <option value="BHHC">Bombay (Maharashtra)</option>
          <option value="MPHC">Madhya Pradesh</option>
        </select>
      </div>
    </div>

    <div id="districtFields" class="grid">
      <div class="field">
        <label for="stateSelect">State</label>
        <select id="stateSelect" onchange="onStateChange()">
          <option value="">Select state</option>
          <option value="2">Andhra Pradesh</option><option value="36">Telangana</option><option value="27">Maharashtra</option>
          <option value="33">Tamil Nadu</option><option value="29">Karnataka</option><option value="32">Kerala</option>
        </select>
      </div>
      <div class="field"><label for="districtInput">District</label><input id="districtInput" placeholder="District code"></div>
      <div class="field"><label for="complexInput">Court complex</label><input id="complexInput" placeholder="Complex code"></div>
    </div>

    <div id="form-cnr" class="searchForm">
      <div class="field" style="margin-bottom:12px">
        <label for="cnrInput">CNR number</label>
        <div class="combo">
          <input id="cnrInput" class="mono" placeholder="Select or type a CNR" oninput="autoDetectBench(this.value)" autocomplete="off">
          <ul id="cnrList" class="combo-list" hidden></ul>
        </div>
      </div>
      
      <div id="cnrHint" class="hint" style="display:none"></div>
    </div>

    <div id="form-case" class="searchForm grid" style="display:none">
      <div class="field"><label for="caseTypeInput">Case type</label><input id="caseTypeInput" placeholder="WP, OS, CRL…"></div>
      <div class="field"><label for="caseNumberInput">Number</label><input id="caseNumberInput" class="mono" placeholder="000001"></div>
      <div class="field"><label for="yearInput">Year</label><input id="yearInput" class="mono" placeholder="2024" maxlength="4"></div>
    </div>

    <div id="form-filing" class="searchForm grid" style="display:none">
      <div class="field"><label for="filingInput">Filing number</label><input id="filingInput" class="mono" placeholder="000001"></div>
      <div class="field"><label for="filingYearInput">Year</label><input id="filingYearInput" class="mono" placeholder="2024" maxlength="4"></div>
    </div>

    <div class="actions">
      <button class="btn" id="btnSearch" onclick="doSearch()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Search
      </button>
    </div>
  </div>

</div>

  <div id="resultsWrap">
    <div class="card empty-state">
      <div class="illo">⚖️</div>
      Enter a case number and press <strong>Search</strong>.<br>Results will appear here.
    </div>
  </div>
</div>
</div>

<script>
let currentSearchBy = 'cnr';
let lastQuickResult = null;
let cnrPrefixMap = {};

// CNR prefix → bench code (also loaded from server for freshness)
const STATIC_PREFIX_MAP = {
  APHC:'APHC', TSHC:'TSHC', DLHC:'DLHC',
  HCMA:'TNHC', TNHC:'TNHC',
  HCBM:'BHHC', BHHC:'BHHC',
  KAHC:'KRHC', KRHC:'KRHC',
  KLHC:'KLHC',
  ALHC:'ALHC', CLHC:'CLHC', GUHC:'GUHC',
  HCMP:'MPHC', MPHC:'MPHC',
  RJHC:'RJHC', PHHC:'PHHC', ORHC:'ORHC',
  PTHC:'PTHC', GWHC:'GWHC', JKHC:'JKHC',
  HPHC:'HPHC', UKHC:'UKHC', JHHC:'JHHC', CGHC:'CGHC',
};

function autoDetectBench(cnr) {
  const prefix = cnr.replace(/-/g,'').slice(0,4).toUpperCase();
  const map = Object.keys(cnrPrefixMap).length ? cnrPrefixMap : STATIC_PREFIX_MAP;
  const bench = map[prefix];
  const hint = document.getElementById('cnrHint');
  if (bench) {
    // Switch to High Court and select the bench
    const courtSel = document.getElementById('courtLevel');
    if (courtSel.value !== 'high_court') {
      courtSel.value = 'high_court';
      onCourtChange();
    }
    document.getElementById('benchSelect').value = bench;
    hint.textContent = `✓ Auto-selected: ${document.getElementById('benchSelect').selectedOptions[0]?.text || bench}`;
    hint.style.display = '';
  } else {
    hint.style.display = 'none';
  }
}

let sampleCnrs = [];
function currentCnrEntry() {
  if (document.getElementById('courtLevel').value !== 'high_court') return null;
  const bench = document.getElementById('benchSelect').value;
  return sampleCnrs.find(c => c.bench === bench) || null;
}
function loadCnrList() {
  const entry = currentCnrEntry();
  const ul = document.getElementById('cnrList');
  ul.innerHTML = (entry ? entry.cnrs : []).map(n => `<li data-cnr="${esc(n)}">${esc(n)}</li>`).join('');
  document.getElementById('cnrInput').placeholder = entry ? `Select one of ${entry.cnrs.length} ${entry.name} CNRs` : 'Enter CNR number';
  ul.hidden = true;
}
function showCnrList() {
  const ul = document.getElementById('cnrList');
  ul.hidden = !ul.children.length;   // always show the full list, regardless of current value
}
(function () {
  const inp = document.getElementById('cnrInput'), ul = document.getElementById('cnrList');
  inp.addEventListener('focus', showCnrList);
  inp.addEventListener('click', showCnrList);
  ul.addEventListener('mousedown', e => {
    const li = e.target.closest('li'); if (!li) return;
    e.preventDefault();
    inp.value = li.dataset.cnr;
    ul.hidden = true;
    autoDetectBench(inp.value);
  });
  document.addEventListener('mousedown', e => { if (!e.target.closest('.combo')) ul.hidden = true; });
})();

function onCourtChange() {
  loadCnrList();
  const v = document.getElementById('courtLevel').value;
  document.getElementById('districtFields').style.display = v === 'district' ? '' : 'none';
  document.getElementById('hcFields').style.display = v === 'high_court' ? '' : 'none';
}

function onStateChange() {}

function setSearchBy(by, btn) {
  currentSearchBy = by;
  document.querySelectorAll('#searchBy button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.searchForm').forEach(f => f.style.display = 'none');
  document.getElementById('form-' + by).style.display = '';
}

function buildPayload() {
  const court = document.getElementById('courtLevel').value;
  const bench = court === 'high_court' ? document.getElementById('benchSelect').value : undefined;
  const tier = 'auto';
  const base = { court, bench, searchBy: currentSearchBy, tier };

  if (currentSearchBy === 'cnr') {
    base.cnr = document.getElementById('cnrInput').value.trim();
  } else if (currentSearchBy === 'case') {
    base.caseType = document.getElementById('caseTypeInput').value.trim();
    base.caseNumber = document.getElementById('caseNumberInput').value.trim();
    base.year = document.getElementById('yearInput').value.trim();
    if (court === 'district') {
      base.state = document.getElementById('stateSelect').value;
      base.district = document.getElementById('districtInput').value.trim();
      base.complex = document.getElementById('complexInput').value.trim();
    }
  } else {
    base.filingNumber = document.getElementById('filingInput').value.trim();
    base.year = document.getElementById('filingYearInput').value.trim();
  }
  return base;
}

async function doSearch() {
  const type = 'quick';
  const allTiers = false;
  const payload = buildPayload();
  const wrap = document.getElementById('resultsWrap');

  setLoading(true);
  wrap.innerHTML = `<div class="loading-overlay"><div class="btn-spinner"></div>Searching… this can take a few seconds while the captcha is solved</div>`;

  if (allTiers && type === 'quick') {
    await runAllTiers(payload);
  } else {
    try {
      const res = await fetch(`/api/${type}`, {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (type === 'quick') lastQuickResult = data;
      wrap.innerHTML = renderResult(data);
    } catch (e) {
      wrap.innerHTML = renderError(e.message);
    }
  }
  setLoading(false);
}

async function runAllTiers(payload) {
  const wrap = document.getElementById('resultsWrap');
  const tiers = ['http', 'lightpanda', 'chromium'];
  const results = [];
  for (const tier of tiers) {
    try {
      const res = await fetch('/api/quick', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({...payload, tier})
      });
      results.push({ tier, data: await res.json() });
    } catch (e) {
      results.push({ tier, data: { ok: false, error: e.message } });
    }
  }
  wrap.innerHTML = renderCompare(results);
}

function setLoading(on) {
  const btn = document.getElementById('btnSearch');
  btn.disabled = on;
  btn.innerHTML = on
    ? '<div class="btn-spinner"></div>Searching…'
    : '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Search';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input') && !document.getElementById('btnSearch').disabled) doSearch();
});

function renderResult(data) {
  if (!data.ok) {
    return `
      <div class="error-banner"><div class="ico">⚠</div><div class="msg"><strong>Search failed</strong><br>${esc(data.error || 'Unknown error')}</div></div>
      ${data.metrics ? renderMetrics(data.metrics) : ''}
    `;
  }
  const c = data.case || {};
  const tierClass = data.tier === 'http' ? 'http' : data.tier === 'lightpanda' ? 'lightpanda' : 'chromium';

  const statusText = c.status || 'Unknown';
  const statusClass = /disposed|closed/i.test(statusText) ? 'ok' : /pending|listed|fixed/i.test(statusText) ? 'pending' : 'other';

  return `
    <div class="result-card">
      <div class="case-header">
        <div class="case-title">
          <h2>${esc(c.caseType || '')} ${esc(c.caseNumber || '')}${c.year ? '/' + esc(c.year) : ''}</h2>
          <div class="meta">
            ${c.cnr ? `<span>CNR: <code>${esc(c.cnr)}</code></span>` : ''}
            ${c.filingDate ? `<span>Filed: ${esc(c.filingDate)}</span>` : ''}
            ${c.nextDate ? `<span>Next: ${esc(c.nextDate)}</span>` : ''}
            ${c.court ? `<span>${esc(c.court)}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="status-pill ${statusClass}">${esc(statusText)}</span>
          <span class="tier-badge ${tierClass}">${esc(data.tier)}</span>
        </div>
      </div>

      <div class="tabs" id="tabBar_${data.runId}">
        <button class="tab-btn active" onclick="switchTab('${data.runId}','details',this)">Details</button>
        <button class="tab-btn" onclick="switchTab('${data.runId}','parties',this)">Parties</button>
        <button class="tab-btn" onclick="switchTab('${data.runId}','hearings',this)">Hearings (${(data.hearings||[]).length})</button>
        <button class="tab-btn" onclick="switchTab('${data.runId}','docs',this)">Documents (${(data.documents||[]).length})</button>
      </div>

      <div id="tab_${data.runId}_details" class="tab-pane active">
        ${renderFieldTable(c)}
      </div>
      <div id="tab_${data.runId}_parties" class="tab-pane">
        ${renderParties(c)}
      </div>
      <div id="tab_${data.runId}_hearings" class="tab-pane">
        ${renderHearings(data.hearings || [])}
      </div>
      <div id="tab_${data.runId}_docs" class="tab-pane">
        ${renderDocuments(data.documents || [])}
      </div>
    </div>
    ${renderMetrics(data.metrics)}
  `;
}

function renderFieldTable(c) {
  const rows = [
    ['Case type', c.caseType], ['Case number', c.caseNumber], ['Year', c.year],
    ['CNR', c.cnr], ['Filing number', c.filingNumber], ['Filing date', c.filingDate],
    ['Status', c.status], ['Next date', c.nextDate], ['Court', c.court],
    ['Judge', c.judge], ['Acts', c.acts?.join(', ')], ['FIR', c.fir],
    ['Data source', c.dataSource], ['Tier', c.tier],
  ].filter(([, v]) => v);
  if (!rows.length) return '<div class="empty-list">No fields returned.</div>';
  return `<table class="field-table">${rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(String(v))}</td></tr>`).join('')}</table>`;
}

function renderParties(c) {
  const all = [...(c.parties || []), ...(c.advocates || [])];
  if (!all.length) return '<div class="empty-list">No party data returned.</div>';
  return `<ul class="party-list">${all.map(p => `
    <li class="party-item">
      <span class="party-role">${esc(p.role)}</span>
      <span class="party-name">${esc(p.name)}</span>
      ${p.advocate ? `<span class="party-adv">Adv: ${esc(p.advocate)}</span>` : ''}
    </li>`).join('')}</ul>`;
}

function renderHearings(hearings) {
  if (!hearings.length) return '<div class="empty-list">No hearing history returned.</div>';
  return `<div class="table-wrap"><table class="data-table">
    <thead><tr><th>Date</th><th>Purpose</th><th>Next date</th><th>Judge</th></tr></thead>
    <tbody>${hearings.map(h => `<tr>
      <td>${esc(h.date || '')}</td>
      <td>${esc(h.purpose || '')}</td>
      <td>${esc(h.nextDate || '')}</td>
      <td>${esc(h.judge || '')}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function renderDocuments(docs) {
  if (!docs.length) return '<div class="empty-list">No documents returned.</div>';
  return `<ul class="doc-list">${docs.map((d, i) => `
    <li class="doc-item">
      <div class="doc-icon">📄</div>
      <div class="doc-info">
        <div class="doc-name">${esc(d.type)} ${i + 1}${d.id ? ' — ' + esc(d.id) : ''}</div>
        <div class="doc-date">${esc(d.date || '')}</div>
      </div>
      ${d.url ? `<a class="doc-link" href="${esc(d.url)}" target="_blank" rel="noopener">Open</a>` : ''}
      ${d.localPath ? `<span class="doc-link" style="cursor:default;opacity:.7">Saved locally</span>` : ''}
    </li>`).join('')}</ul>`;
}

function renderMetrics(m) {
  if (!m) return '';
  const captchaRate = m.captchaAttempts > 0 ? Math.round((m.captchaSolves / m.captchaAttempts) * 100) : 0;
  const escText = m.tierEscalations?.length ? `<div class="escalations">
    Tier escalations:&nbsp;${m.tierEscalations.map(e => `<span class="esc">${esc(e.from)} → ${esc(e.to)}: ${esc(e.reason)}</span>`).join('')}
  </div>` : '';
  return `
    <div class="metrics-panel">
      <div class="panel-head"><div class="dot" style="background:var(--ok)"></div>Run metrics · <span style="font-family:var(--ff-mono);font-size:11px;color:var(--fg3)">${esc(m.runId)}</span></div>
      <div class="metrics-grid">
        <div class="metric-cell"><div class="label">Duration</div><div class="value">${m.durationMs.toLocaleString()}<span class="unit">ms</span></div></div>
        <div class="metric-cell"><div class="label">Response</div><div class="value">${(m.responseBytes/1024).toFixed(1)}<span class="unit">KB</span></div></div>
        <div class="metric-cell"><div class="label">Memory</div><div class="value">${m.peakMemoryMb}<span class="unit">MB</span></div></div>
        <div class="metric-cell"><div class="label">Captcha</div><div class="value">${m.captchaSolves}/${m.captchaAttempts} <span class="unit">${captchaRate}%</span></div></div>
        <div class="metric-cell"><div class="label">Tier used</div><div class="value" style="font-size:14px">${esc(m.tier)}</div></div>
        <div class="metric-cell"><div class="label">Provider</div><div class="value" style="font-size:14px">${esc(m.captchaProvider)}</div></div>
      </div>
      ${escText}
    </div>`;
}

function renderCompare(results) {
  return `
    <div class="compare-grid">
      ${results.map(r => `
        <div>
          <div class="result-card">
            <div class="compare-label">Tier: ${esc(r.tier)} ${r.data.ok ? '✓' : '✗'}</div>
            ${r.data.ok ? `
              <table class="field-table">
                <tr><td>Duration</td><td>${r.data.metrics?.durationMs?.toLocaleString() ?? '—'} ms</td></tr>
                <tr><td>Response</td><td>${r.data.metrics ? (r.data.metrics.responseBytes/1024).toFixed(1) : '—'} KB</td></tr>
                <tr><td>Captcha</td><td>${r.data.metrics?.captchaSolves ?? 0}/${r.data.metrics?.captchaAttempts ?? 0}</td></tr>
                <tr><td>Memory</td><td>${r.data.metrics?.peakMemoryMb ?? '—'} MB</td></tr>
                <tr><td>Status</td><td>${esc(r.data.case?.status || '—')}</td></tr>
                <tr><td>Fields</td><td>${r.data.case ? Object.entries(r.data.case).filter(([,v])=>v).length : 0} returned</td></tr>
              </table>
            ` : `<div style="padding:14px;color:var(--err);font-size:13px">${esc(r.data.error || 'Failed')}</div>`}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderError(msg) {
  return `<div class="error-banner"><div class="ico">⚠</div><div class="msg"><strong>Request failed</strong><br>${esc(msg)}</div></div>`;
}

function switchTab(runId, tab, btn) {
  const bar = document.getElementById('tabBar_' + runId);
  if (!bar) return;
  bar.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  bar.parentElement.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  const pane = document.getElementById(`tab_${runId}_${tab}`);
  if (pane) pane.classList.add('active');
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Load reference data and check server
(async () => {
  try {
    const r = await fetch('/api/reference/cnr-prefix-map');
    if (r.ok) cnrPrefixMap = await r.json();
  } catch {}
  try {
    const r = await fetch('/api/reference/sample-cnrs');
    if (r.ok) { sampleCnrs = (await r.json()).courts; loadCnrList(); }
  } catch {}
})();
</script>
</body>
</html>
